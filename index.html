<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI ZASEIER - Futuristic Chat</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;500;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Space Grotesk', sans-serif;
            background-color: #020205;
            color: #e0e0e0;
            overflow: hidden;
            height: 100vh;
        }

        /* Background Watermark */
        .watermark {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%) rotate(-10deg);
            font-size: 12vw;
            font-weight: 900;
            color: rgba(0, 255, 255, 0.02);
            white-space: nowrap;
            pointer-events: none;
            z-index: 0;
            text-transform: uppercase;
            letter-spacing: -0.5rem;
        }

        /* Neon Glow Effects */
        .neon-border {
            box-shadow: 0 0 20px rgba(0, 255, 255, 0.2);
            border: 1px solid rgba(0, 255, 255, 0.3);
        }

        .neon-text {
            text-shadow: 0 0 15px rgba(0, 255, 255, 0.6);
        }

        .glass-panel {
            background: rgba(10, 10, 15, 0.7);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.05);
        }

        /* Message Bubbles */
        .user-msg {
            background: linear-gradient(135deg, rgba(0, 255, 255, 0.1), rgba(0, 255, 255, 0.05));
            border-left: 3px solid #00ffff;
        }

        .ai-msg {
            background: rgba(255, 255, 255, 0.03);
            border-left: 3px solid rgba(255, 255, 255, 0.2);
        }

        /* Animations */
        @keyframes pulse-soft {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }
        .animate-pulse-soft { animation: pulse-soft 3s infinite; }
    </style>
</head>
<body class="flex items-center justify-center p-4 md:p-8">

    <div class="watermark">AI ZASEIER</div>

    <div class="w-full max-w-5xl h-full glass-panel rounded-3xl flex flex-col relative z-10 shadow-[0_0_50px_rgba(0,0,0,0.5)]">
        
        <header class="p-6 border-b border-white/5 flex justify-between items-center bg-black/20">
            <div class="flex items-center gap-4">
                <div class="w-10 h-10 rounded-full bg-cyan-500 flex items-center justify-center neon-border">
                    <span class="text-black font-bold text-xl">Z</span>
                </div>
                <div>
                    <h1 class="text-xl font-bold tracking-widest neon-text text-cyan-400">AI ZASEIER</h1>
                    <div class="flex items-center gap-2">
                        <span class="w-2 h-2 bg-green-500 rounded-full animate-pulse"></span>
                        <span class="text-[10px] text-gray-400 uppercase tracking-tighter">System Online | Groq Engine</span>
                    </div>
                </div>
            </div>
        </header>

        <div id="chat-container" class="flex-1 overflow-y-auto p-6 space-y-6 scroll-smooth">
            <div class="ai-msg p-4 rounded-r-xl max-w-[85%]">
                <p class="text-sm leading-relaxed italic text-cyan-100/70">
                    Sistem Zaseier telah diinisialisasi. Menunggu instruksi...
                </p>
            </div>
        </div>

        <div class="p-6 border-t border-white/5 bg-black/40">
            <div class="relative flex items-center gap-3">
                <input type="text" id="user-input" 
                    class="flex-1 bg-white/5 border border-white/10 rounded-2xl py-4 px-6 focus:outline-none focus:border-cyan-500 transition-all text-sm placeholder-gray-600"
                    placeholder="Kirim perintah ke AI Zaseier...">
                
                <button onclick="sendMessage()" id="send-btn"
                    class="bg-cyan-500 hover:bg-cyan-400 text-black font-bold py-4 px-8 rounded-2xl transition-all duration-300 neon-border flex items-center justify-center">
                    <span id="btn-text">SEND</span>
                </button>
            </div>
            <p class="text-[9px] text-center mt-4 text-gray-600 tracking-widest uppercase">Powered by AI Zaseier Neural Network</p>
        </div>
    </div>

    <script>
        const API_KEY = "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";
        const chatContainer = document.getElementById('chat-container');
        const userInput = document.getElementById('user-input');
        const btnText = document.getElementById('btn-text');

        function appendMessage(role, text) {
            const msgDiv = document.createElement('div');
            msgDiv.className = `flex ${role === 'user' ? 'justify-end' : 'justify-start'} animate-fade-in`;
            
            const content = `
                <div class="${role === 'user' ? 'user-msg' : 'ai-msg'} p-4 rounded-xl max-w-[85%] shadow-sm">
                    <p class="text-xs uppercase font-bold mb-1 ${role === 'user' ? 'text-cyan-400' : 'text-gray-400'}">${role === 'user' ? 'You' : 'Zaseier AI'}</p>
                    <p class="text-sm leading-relaxed">${text}</p>
                </div>
            `;
            
            msgDiv.innerHTML = content;
            chatContainer.appendChild(msgDiv);
            chatContainer.scrollTop = chatContainer.scrollHeight;
        }

        async function sendMessage() {
            const message = userInput.value.trim();
            if (!message) return;

            appendMessage('user', message);
            userInput.value = '';
            btnText.innerText = "WAIT...";
            
            try {
                const response = await fetch("https://api.groq.com/openai/v1/chat/completions", {
                    method: "POST",
                    headers: {
                        "Authorization": `Bearer ${API_KEY}`,
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify({
                        "model": "llama-3.3-70b-versatile",
                        "messages": [
                            {"role": "system", "content": "You are AI Zaseier, a futuristic and helpful AI assistant."},
                            {"role": "user", "content": message}
                        ],
                        "temperature": 0.7
                    })
                });

                const data = await response.json();
                
                if (data.choices && data.choices[0]) {
                    const aiResponse = data.choices[0].message.content;
                    appendMessage('ai', aiResponse);
                } else {
                    throw new Error("Invalid response format");
                }

            } catch (error) {
                console.error("Error:", error);
                appendMessage('ai', "Error: Gagal terhubung ke modul pusat Zaseier. Pastikan koneksi stabil.");
            } finally {
                btnText.innerText = "SEND";
            }
        }

        userInput.addEventListener("keypress", (e) => {
            if (e.key === "Enter") sendMessage();
        });
    </script>
</body>
</html>
