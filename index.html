<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI ZASEIER - Futuristic Chat</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;500;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Space Grotesk', sans-serif;
            background-color: #050505;
            color: #e0e0e0;
            overflow: hidden;
        }

        /* Background Watermark */
        .watermark {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%) rotate(-15deg);
            font-size: 15vw;
            font-weight: 800;
            color: rgba(255, 255, 255, 0.03);
            white-space: nowrap;
            pointer-events: none;
            z-index: 0;
            text-transform: uppercase;
        }

        /* Neon Glow Effects */
        .neon-border {
            box-shadow: 0 0 15px rgba(0, 255, 255, 0.3), inset 0 0 5px rgba(0, 255, 255, 0.2);
            border: 1px solid rgba(0, 255, 255, 0.4);
        }

        .neon-text {
            text-shadow: 0 0 10px rgba(0, 255, 255, 0.8);
        }

        /* Custom Scrollbar */
        ::-webkit-scrollbar { width: 4px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #00ffff; border-radius: 10px; }

        .glass-panel {
            background: rgba(15, 15, 15, 0.8);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
    </style>
</head>
<body class="h-screen flex flex-col items-center justify-center p-4">

    <div class="watermark">AI ZASEIER</div>

    <div class="w-full max-w-4xl h-[90vh] glass-panel rounded-2xl flex flex-col relative z-10 overflow-hidden shadow-2xl">
        
        <header class="p-6 border-b border-white/10 flex justify-between items-center">
            <div>
                <h1 class="text-2xl font-bold tracking-tighter neon-text text-cyan-400">AI ZASEIER</h1>
                <p class="text-xs text-gray-500 uppercase tracking-widest">Next-Gen Intelligence</p>
            </div>
            <div class="h-3 w-3 bg-cyan-500 rounded-full animate-pulse shadow-[0_0_10px_#00ffff]"></div>
        </header>

        <div id="chat-container" class="flex-1 overflow-y-auto p-6 space-y-6">
            <div class="flex flex-col items-start">
                <div class="max-w-[80%] p-4 rounded-tr-2xl rounded-bl-2xl bg-white/5 border border-white/10">
                    <p class="text-sm">Sistem aktif. Apa yang bisa saya bantu hari ini?</p>
                </div>
            </div>
        </div>

        <div class="p-6 bg-black/40">
            <div class="relative flex items-center">
                <input type="text" id="user-input" 
                    class="w-full bg-white/5 border border-white/10 rounded-full py-4 px-6 focus:outline-none focus:ring-1 focus:ring-cyan-500 transition-all text-sm"
                    placeholder="Ketik pesan anda di sini...">
                <button onclick="sendMessage()" 
                    class="absolute right-2 bg-cyan-500 hover:bg-cyan-400 text-black font-bold py-2 px-6 rounded-full transition-all duration-300 neon-border">
                    SEND
                </button>
            </div>
        </div>
    </div>

    <script>
        const API_KEY = "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";
        const chatContainer = document.getElementById('chat-container');
        const userInput = document.getElementById('user-input');

        // Fungsi Tambah Chat ke UI
        function appendMessage(role, text) {
            const msgDiv = document.createElement('div');
            msgDiv.className = `flex flex-col ${role === 'user' ? 'items-end' : 'items-start'}`;
            
            const innerDiv = document.createElement('div');
            innerDiv.className = `max-w-[80%] p-4 ${role === 'user' 
                ? 'bg-cyan-900/30 border border-cyan-500/50 rounded-tl-2xl rounded-br-2xl' 
                : 'bg-white/5 border border-white/10 rounded-tr-2xl rounded-bl-2xl'}`;
            
            innerDiv.innerHTML = `<p class="text-sm">${text}</p>`;
            msgDiv.appendChild(innerDiv);
            chatContainer.appendChild(msgDiv);
            
            // Auto scroll ke bawah
            chatContainer.scrollTop = chatContainer.scrollHeight;
        }

        async function sendMessage() {
            const message = userInput.value.trim();
            if (!message) return;

            appendMessage('user', message);
            userInput.value = '';

            try {
                const response = await fetch("https://openrouter.ai/api/v1/chat/completions", {
                    method: "POST",
                    headers: {
                        "Authorization": `Bearer ${API_KEY}`,
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify({
                        "model": "google/gemini-2.0-flash-lite-preview-02-05:free",
                        "messages": [
                            {"role": "user", "content": message}
                        ]
                    })
                });

                const data = await response.json();
                const aiResponse = data.choices[0].message.content;
                appendMessage('ai', aiResponse);

            } catch (error) {
                console.error("Error:", error);
                appendMessage('ai', "Koneksi terputus. Coba lagi nanti.");
            }
        }

        // Support tekan Enter untuk kirim
        userInput.addEventListener("keypress", function(event) {
            if (event.key === "Enter") {
                sendMessage();
            }
        });
    </script>
</body>
</html>
